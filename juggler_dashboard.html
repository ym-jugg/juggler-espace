<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジャグラー設置分析ボード</title>
<style>
  :root{
    --bg: #17130f;
    --bg-panel: #1f1a14;
    --bg-panel-2: #241e17;
    --line: #3a3226;
    --line-soft: #2a251d;
    --gold: #e0a94a;
    --gold-dim: #a3854c;
    --text: #f0e6d2;
    --text-dim: #9c8f78;
    --text-faint: #6b6152;
    --s1:#1e3a8a; --s2:#0891b2; --s3:#16a34a; --s4:#ca9a12; --s5:#ea580c; --s6:#dc2626;
    --mono: ui-monospace, 'SF Mono', 'Consolas', 'Menlo', monospace;
    --disp: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 20% -10%, #241d13 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wrap{max-width: 1180px; margin: 0 auto;}

  .board-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    border-bottom: 2px solid var(--gold-dim);
    padding-bottom:14px; margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .board-title{
    font-family: var(--disp); font-weight:800; letter-spacing:0.04em;
    font-size: 26px; color: var(--gold);
    text-shadow: 0 0 18px rgba(224,169,74,0.25);
  }
  .board-sub{font-size:12px; color:var(--text-dim); margin-top:4px; letter-spacing:0.02em;}
  .board-meta{font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:right; line-height:1.6;}

  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{
    font-family: var(--disp); font-weight:700; letter-spacing:0.03em;
    background: var(--bg-panel); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 9px 18px; font-size: 13px; cursor:pointer;
    transition: all .15s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{ background: linear-gradient(180deg, #3a2e19, #241c10); color: var(--gold); border-color: var(--gold-dim); box-shadow: inset 0 0 0 1px rgba(224,169,74,0.15); }

  .panel{ background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* legend */
  .legend{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-family: var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;}
  .legend-scale{ display:flex; align-items:center; gap:4px;}
  .legend-chip{ width:20px; height:14px; border-radius:2px; display:inline-block;}
  .legend-label{margin-right:2px;}

  /* controls row */
  .controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-dim); background: var(--bg-panel-2); cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ border-color: var(--gold-dim); color: var(--gold); background:#2c2313; }
  select{
    font-family: var(--mono); font-size:12px; background: var(--bg-panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:4px; padding:6px 8px;
  }

  /* trend table */
  table{ border-collapse: collapse; width:100%; font-family: var(--mono); font-size: 12px; }
  thead th{
    text-align:left; font-weight:600; color: var(--text-faint); font-size:10.5px;
    letter-spacing:0.06em; text-transform:uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line);
    position:sticky; top:0; background: var(--bg-panel);
  }
  tbody tr{ border-bottom: 1px solid var(--line-soft); cursor:pointer; }
  tbody tr:hover{ background: rgba(224,169,74,0.05); }
  tbody td{ padding: 7px 8px; vertical-align: middle; color: var(--text); }
  .machine-name{ color: var(--text-dim); font-size:11px; }
  .slot-num{ color: var(--gold); font-weight:700; }
  .day-cell{ display:flex; align-items:center; justify-content:center; }
  .day-sq{
    width:26px; height:26px; border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:11px; color:#0c0a07; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
  }
  .day-sq.empty{ background: var(--bg-panel-2); color: var(--text-faint); box-shadow:none; }
  .avg-badge{
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    font-weight:700; font-size:11.5px; color:#0c0a07;
  }
  .conf-tag{ font-size:10px; padding:1px 6px; border-radius:3px; border:1px solid var(--line); color:var(--text-dim);}
  .conf-高{ color:#e0a94a; border-color:#a3854c; }

  .detail-row td{ background: var(--bg-panel-2); padding: 10px 14px 14px; }
  .detail-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; font-family: var(--mono); font-size:11px;}
  .detail-day{ border:1px solid var(--line); border-radius:4px; padding:7px 9px; }
  .detail-day .dd-date{ color:var(--text-faint); font-size:10px; margin-bottom:4px;}
  .detail-day .dd-row{ display:flex; justify-content:space-between; margin-top:2px; }
  .detail-day .dd-remark{ margin-top:6px; color:var(--text-dim); font-size:10px; line-height:1.4; font-family: -apple-system, sans-serif;}

  /* floor view */
  .floor-toolbar{ display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
  .floor-wrap{ overflow-x:auto; padding:10px 0;}
  .floor-grid{
    display:grid; gap:3px; width:max-content; margin:0 auto;
    padding:14px; background: repeating-linear-gradient(0deg, #14100c, #14100c 27px, #17120d 27px, #17120d 28px);
    border:1px solid var(--line); border-radius:6px;
  }
  .floor-cell{
    width:27px; height:27px; border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-size:9px; font-weight:700; color:#0c0a07; cursor:pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3);
    position:relative;
  }
  .floor-cell:hover{ outline: 1.5px solid var(--gold); z-index:2; }
  .floor-label{
    font-family: var(--mono); font-size:9px; color: var(--text-faint); display:flex; align-items:center; justify-content:center;
  }
  .tooltip{
    position: fixed; pointer-events:none; z-index: 50;
    background: #0c0a07; border:1px solid var(--gold-dim); border-radius:5px; padding:9px 11px;
    font-family: var(--mono); font-size:11px; color: var(--text); line-height:1.6; min-width:170px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    display:none;
  }
  .tooltip .tt-title{ color: var(--gold); font-weight:700; margin-bottom:3px; }
  .tooltip .tt-row{ display:flex; justify-content:space-between; gap:14px; }

  .machine-legend{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:16px; font-family: var(--mono); font-size:10.5px; color:var(--text-dim);}
  .machine-legend .dot{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; }

  footer{ text-align:center; color: var(--text-faint); font-size:10.5px; margin-top:28px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">

  <div class="board-header">
    <div>
      <div class="board-title">JUGGLER FLOOR ANALYSIS</div>
      <div class="board-sub">エスパス日拓渋谷駅前新館 &middot; ジャグラー系Aタイプ台データ分析ボード（試作版）</div>
    </div>
    <div class="board-meta" id="metaBox"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-view="trend">台トレンド</button>
    <button class="tab-btn" data-view="floor">フロアヒートマップ</button>
  </div>

  <!-- TREND VIEW -->
  <div class="view active" id="view-trend">
    <div class="panel">
      <div class="legend">
        <span class="legend-label">推定設定:</span>
        <span class="legend-scale" id="scaleLegend"></span>
        <span style="margin-left:auto; color:var(--text-faint);">セルクリックで日別詳細を表示</span>
      </div>
      <div class="controls">
        <div class="chips" id="machineChips"></div>
        <select id="sortSelect">
          <option value="avgDesc">平均設定 高い順</option>
          <option value="avgAsc">平均設定 低い順</option>
          <option value="slotAsc">台番号順</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table id="trendTable">
          <thead>
            <tr>
              <th>機種</th>
              <th>台番号</th>
              <th id="dateHeaders" colspan="6" style="text-align:center;"></th>
              <th>平均</th>
              <th>直近信頼度</th>
            </tr>
          </thead>
          <tbody id="trendBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FLOOR VIEW -->
  <div class="view" id="view-floor">
    <div class="panel">
      <div class="floor-toolbar">
        <span class="legend-label" style="font-family:var(--mono); font-size:11px; color:var(--text-dim);">表示日:</span>
        <div class="chips" id="dateChips"></div>
        <span class="legend-scale" id="scaleLegend2" style="margin-left:auto;"></span>
      </div>
      <div class="floor-wrap">
        <div class="floor-grid" id="floorGrid"></div>
      </div>
      <div class="machine-legend" id="machineLegend"></div>
    </div>
  </div>

  <footer>DATA: ana-slo.com 収集値をもとに推定 &middot; 試作版 UI &middot; 実際の設定を保証するものではありません</footer>
</div>

<div class="tooltip" id="tooltip"></div>

const SETTING_COLOR = {1:'var(--s1)',2:'var(--s2)',3:'var(--s3)',4:'var(--s4)',5:'var(--s5)',6:'var(--s6)'};
const SETTING_HEX = {1:'#1e3a8a',2:'#0891b2',3:'#16a34a',4:'#ca9a12',5:'#ea580c',6:'#dc2626'};
const dates = DATA.dates;

// legend scale builder
function buildScale(el){
  el.innerHTML = '';
  for(let s=1;s<=6;s++){
    const chip = document.createElement('span');
    chip.className='legend-chip';
    chip.style.background = SETTING_HEX[s];
    el.appendChild(chip);
    const lab = document.createElement('span');
    lab.textContent = s + (s<6?' ':'');
    lab.style.marginRight='6px';
    el.appendChild(lab);
  }
}
buildScale(document.getElementById('scaleLegend'));
buildScale(document.getElementById('scaleLegend2'));

// tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

/* ---------- TREND VIEW ---------- */
const machineOrder = Object.keys(DATA.machineSlots);
let activeMachines = new Set(machineOrder);
let sortMode = 'avgDesc';

const chipsWrap = document.getElementById('machineChips');
function renderChips(){
  chipsWrap.innerHTML='';
  const allChip = document.createElement('span');
  allChip.className = 'chip' + (activeMachines.size===machineOrder.length ? ' active':'');
  allChip.textContent = 'すべて';
  allChip.onclick = ()=>{ activeMachines = new Set(machineOrder); renderChips(); renderTrend(); };
  chipsWrap.appendChild(allChip);
  machineOrder.forEach(m=>{
    const c = document.createElement('span');
    c.className = 'chip' + (activeMachines.has(m) ? ' active':'');
    c.textContent = m + '(' + DATA.machineSlots[m].length + ')';
    c.onclick = ()=>{
      if(activeMachines.has(m) && activeMachines.size===1){ activeMachines = new Set(machineOrder); }
      else { activeMachines = new Set([m]); }
      renderChips(); renderTrend();
    };
    chipsWrap.appendChild(c);
  });
}
renderChips();

(function(){
  const thRow = document.querySelector('#trendTable thead tr');
  const oldTh = document.getElementById('dateHeaders');
  const frag = document.createDocumentFragment();
  dates.forEach(d=>{
    const th = document.createElement('th');
    th.style.textAlign='center';
    th.textContent = d.slice(5).replace('-','/');
    frag.appendChild(th);
  });
  thRow.replaceChild(frag, oldTh);
})();

document.getElementById('sortSelect').addEventListener('change', e=>{
  sortMode = e.target.value; renderTrend();
});

function avgSetting(days){
  if(!days.length) return null;
  return days.reduce((a,d)=>a+d.setting,0)/days.length;
}

function renderTrend(){
  const tbody = document.getElementById('trendBody');
  tbody.innerHTML = '';
  let rows = [];
  machineOrder.forEach(m=>{
    if(!activeMachines.has(m)) return;
    DATA.machineSlots[m].forEach(slot=>{
      const days = DATA.slotData[slot] || [];
      rows.push({machine:m, slot, days, avg: avgSetting(days)});
    });
  });
  if(sortMode==='avgDesc') rows.sort((a,b)=> (b.avg??0)-(a.avg??0));
  else if(sortMode==='avgAsc') rows.sort((a,b)=> (a.avg??0)-(b.avg??0));
  else rows.sort((a,b)=> parseInt(a.slot)-parseInt(b.slot));

  rows.forEach(row=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="machine-name">${row.machine}</td>
      <td class="slot-num">${row.slot}</td>
    `;
    const dayMap = {};
    row.days.forEach(d=> dayMap[d.date]=d);
    dates.forEach(d=>{
      const td = document.createElement('td');
      td.className='day-cell';
      const rec = dayMap[d];
      if(rec){
        td.innerHTML = `<span class="day-sq" style="background:${SETTING_HEX[rec.setting]}">${rec.setting}</span>`;
      } else {
        td.innerHTML = `<span class="day-sq empty">-</span>`;
      }
      tr.appendChild(td);
    });
    const avgTd = document.createElement('td');
    if(row.avg!=null){
      const rounded = Math.round(row.avg*10)/10;
      const nearest = Math.round(row.avg);
      avgTd.innerHTML = `<span class="avg-badge" style="background:${SETTING_HEX[Math.min(6,Math.max(1,nearest))]}">${rounded}</span>`;
    }
    tr.appendChild(avgTd);
    const confTd = document.createElement('td');
    const latest = row.days[row.days.length-1];
    if(latest){
      confTd.innerHTML = `<span class="conf-tag conf-${latest.conf}">${latest.conf}</span>`;
    }
    tr.appendChild(confTd);

    tr.addEventListener('click', ()=>{
      const existing = tr.nextElementSibling;
      if(existing && existing.classList.contains('detail-row')){
        existing.remove();
        return;
      }
      document.querySelectorAll('.detail-row').forEach(r=>r.remove());
      const dtr = document.createElement('tr');
      dtr.className='detail-row';
      const dtd = document.createElement('td');
      dtd.colSpan = 3 + dates.length + 2;
      const grid = document.createElement('div');
      grid.className='detail-grid';
      row.days.forEach(d=>{
        const box = document.createElement('div');
        box.className='detail-day';
        box.innerHTML = `
          <div class="dd-date">${d.date}</div>
          <div class="dd-row"><span>G数</span><span>${d.g.toLocaleString()}</span></div>
          <div class="dd-row"><span>差枚</span><span style="color:${d.sa>=0?'#7dd3a8':'#e88'}">${d.sa>=0?'+':''}${d.sa.toLocaleString()}</span></div>
          <div class="dd-row"><span>合成</span><span>${d.gousei}</span></div>
          <div class="dd-row"><span>設定/信頼度</span><span style="color:${SETTING_HEX[d.setting]}">${d.setting} / ${d.conf}</span></div>
          <div class="dd-remark">${d.remark}</div>
        `;
        grid.appendChild(box);
      });
      dtd.appendChild(grid);
      dtr.appendChild(dtd);
      tr.after(dtr);
    });

    tbody.appendChild(tr);
  });
}
renderTrend();

/* ---------- FLOOR VIEW ---------- */
let selectedDate = dates[dates.length-1];
const dateChipsWrap = document.getElementById('dateChips');
function renderDateChips(){
  dateChipsWrap.innerHTML='';
  dates.forEach(d=>{
    const c = document.createElement('span');
    c.className='chip'+(d===selectedDate?' active':'');
    c.textContent = d.slice(5).replace('-','/');
    c.onclick = ()=>{ selectedDate=d; renderDateChips(); renderFloor(); };
    dateChipsWrap.appendChild(c);
  });
  const avgChip = document.createElement('span');
  avgChip.className='chip'+(selectedDate==='avg'?' active':'');
  avgChip.textContent='期間平均';
  avgChip.onclick = ()=>{ selectedDate='avg'; renderDateChips(); renderFloor(); };
  dateChipsWrap.appendChild(avgChip);
}
renderDateChips();

// grid bounds
let maxRow=0, maxCol=0;
Object.values(DATA.positions).forEach(p=>{ maxRow=Math.max(maxRow,p.row); maxCol=Math.max(maxCol,p.col); });

const floorGrid = document.getElementById('floorGrid');
floorGrid.style.gridTemplateColumns = `repeat(${maxCol+1}, 27px)`;
floorGrid.style.gridTemplateRows = `repeat(${maxRow+1}, 27px)`;

function renderFloor(){
  floorGrid.innerHTML='';
  const cellMap = {};
  Object.entries(DATA.positions).forEach(([slot,pos])=>{
    cellMap[`${pos.row}_${pos.col}`] = slot;
  });
  for(let r=0;r<=maxRow;r++){
    for(let c=0;c<=maxCol;c++){
      const slot = cellMap[`${r}_${c}`];
      const div = document.createElement('div');
      if(slot){
        const days = DATA.slotData[slot] || [];
        let setting=null, dayRec=null;
        if(selectedDate==='avg'){
          const avg = avgSetting(days);
          setting = avg!=null ? Math.round(avg) : null;
        } else {
          dayRec = days.find(d=>d.date===selectedDate);
          setting = dayRec ? dayRec.setting : null;
        }
        div.className='floor-cell';
        div.style.background = setting ? SETTING_HEX[Math.min(6,Math.max(1,setting))] : '#2a251d';
        div.style.gridColumn = c+1;
        div.style.gridRow = r+1;
        div.textContent = slot.slice(-2);
        div.addEventListener('mousemove', (e)=>{
          const machine = DATA.slotMachine[slot];
          let html = `<div class="tt-title">${machine} #${slot}</div>`;
          if(dayRec){
            html += `<div class="tt-row"><span>推定設定</span><span>${dayRec.setting} (${dayRec.conf})</span></div>`;
            html += `<div class="tt-row"><span>G数</span><span>${dayRec.g.toLocaleString()}</span></div>`;
            html += `<div class="tt-row"><span>差枚</span><span>${dayRec.sa>=0?'+':''}${dayRec.sa.toLocaleString()}</span></div>`;
          } else if(selectedDate==='avg'){
            const avg = avgSetting(days);
            html += `<div class="tt-row"><span>平均推定設定</span><span>${avg!=null?Math.round(avg*10)/10:'-'}</span></div>`;
          } else {
            html += `<div class="tt-row"><span>データなし</span><span>-</span></div>`;
          }
          tooltip.innerHTML = html;
          tooltip.style.display='block';
          tooltip.style.left = (e.clientX+14)+'px';
          tooltip.style.top = (e.clientY+14)+'px';
        });
        div.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });
      } else {
        div.style.gridColumn = c+1;
        div.style.gridRow = r+1;
        div.style.background='transparent';
      }
      floorGrid.appendChild(div);
    }
  }
}
renderFloor();

// machine legend (island list)
const mLegend = document.getElementById('machineLegend');
machineOrder.forEach(m=>{
  const s = document.createElement('span');
  s.textContent = `${m}（${DATA.machineSlots[m].length}台）`;
  mLegend.appendChild(s);
});

</script>
