<title>ジャグラー設置分析ボード</title>
<style>
  :root{
    --bg: #17130f;
    --bg-panel: #1f1a14;
    --bg-panel-2: #241e17;
    --line: #3a3226;
    --line-soft: #2a251d;
    --gold: #e0a94a;
    --gold-dim: #a3854c;
    --text: #f0e6d2;
    --text-dim: #9c8f78;
    --text-faint: #6b6152;
    --s1:#1e3a8a; --s2:#0891b2; --s3:#16a34a; --s4:#ca9a12; --s5:#ea580c; --s6:#dc2626;
    --mono: ui-monospace, 'SF Mono', 'Consolas', 'Menlo', monospace;
    --disp: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 20% -10%, #241d13 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wrap{max-width: 1180px; margin: 0 auto;}

  .board-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    border-bottom: 2px solid var(--gold-dim);
    padding-bottom:14px; margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .board-title-group{ display:flex; align-items:center; gap:14px; }
  .mascot{
    width:52px; height:52px; border-radius:50%;
    border: 2px solid var(--gold-dim);
    box-shadow: 0 0 16px rgba(224,169,74,0.35), inset 0 0 0 2px rgba(0,0,0,0.4);
    background: #17130f;
    flex-shrink:0;
  }
  .board-title{
    font-family: var(--disp); font-weight:800; letter-spacing:0.04em;
    font-size: 26px; color: var(--gold);
    text-shadow: 0 0 18px rgba(224,169,74,0.25);
  }
  .board-sub{font-size:12px; color:var(--text-dim); margin-top:4px; letter-spacing:0.02em;}
  .board-meta{font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:right; line-height:1.6;}

  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{
    font-family: var(--disp); font-weight:700; letter-spacing:0.03em;
    background: var(--bg-panel); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 7px 18px; font-size: 13px; cursor:pointer;
    text-align:center; line-height:1.35;
    transition: all .15s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{ background: linear-gradient(180deg, #3a2e19, #241c10); color: var(--gold); border-color: var(--gold-dim); box-shadow: inset 0 0 0 1px rgba(224,169,74,0.15); }

  .panel{ background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* legend */
  .legend{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-family: var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;}
  .legend-scale{ display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  .legend-scale-grid{
    display:grid; grid-template-columns:repeat(3, auto); grid-auto-flow:row;
    justify-content:start; column-gap:16px; row-gap:6px; margin-bottom:14px;
  }
  .legend-scale-grid .ls-item{ display:flex; align-items:center; gap:4px; }
  .legend-scale-grid .ls-item span.legend-chip{ flex-shrink:0; }
  .legend-scale-grid .ls-item span.ls-label{ font-size:9px; color:var(--text-dim); font-family:var(--mono); white-space:nowrap; }
  .legend-chip{ width:20px; height:14px; border-radius:2px; display:inline-block;}
  .legend-label{margin-right:2px;}

  /* controls row */
  .controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-dim); background: var(--bg-panel-2); cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ border-color: var(--gold-dim); color: var(--gold); background:#2c2313; }
  select{
    font-family: var(--mono); font-size:12px; background: var(--bg-panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:4px; padding:6px 8px;
  }

  /* trend table */
  table{ border-collapse: collapse; width:100%; font-family: var(--mono); font-size: 12px; }
  thead th{
    text-align:left; font-weight:600; color: var(--text-faint); font-size:10.5px;
    letter-spacing:0.06em; text-transform:uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line);
    position:sticky; top:0; background: var(--bg-panel);
  }
  tbody tr{ border-bottom: 1px solid var(--line-soft); cursor:pointer; }
  tbody tr:hover{ background: rgba(224,169,74,0.05); }
  tbody td{ padding: 7px 8px; vertical-align: middle; color: var(--text); }
  .machine-name{ color: var(--text-dim); font-size:11px; }
  .slot-num{ color: var(--gold); font-weight:700; }
  .day-cell{ display:flex; align-items:center; justify-content:center; }
  .day-sq{
    width:26px; height:26px; border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:11px; color:#0c0a07; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
  }
  .day-sq.empty{ background: var(--bg-panel-2); color: var(--text-faint); box-shadow:none; }
  .avg-badge{
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    font-weight:700; font-size:11.5px; color:#0c0a07;
  }
  .conf-tag{ font-size:10px; padding:1px 6px; border-radius:3px; border:1px solid var(--line); color:var(--text-dim);}
  .conf-高{ color:#e0a94a; border-color:#a3854c; }

  .detail-row td{ background: var(--bg-panel-2); padding: 10px 14px 14px; }
  .detail-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; font-family: var(--mono); font-size:11px;}
  .detail-day{ border:1px solid var(--line); border-radius:4px; padding:7px 9px; }
  .detail-day .dd-date{ color:var(--text-faint); font-size:10px; margin-bottom:4px;}
  .detail-day .dd-row{ display:flex; justify-content:space-between; margin-top:2px; }
  .detail-day .dd-remark{ margin-top:6px; color:var(--text-dim); font-size:10px; line-height:1.4; font-family: -apple-system, sans-serif;}

  /* floor view */
  .floor-toolbar{ display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
  .floor-wrap{ overflow-x:auto; padding:10px 0;}
  .floor-grid{
    display:grid; gap:3px; width:max-content; margin:0 auto;
    padding:14px; background: repeating-linear-gradient(0deg, #14100c, #14100c 27px, #17120d 27px, #17120d 28px);
    border:1px solid var(--line); border-radius:6px;
  }
  .floor-cell{
    width:34px; height:27px; border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-size:8.5px; font-weight:700; color:#0c0a07; cursor:pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3);
    position:relative;
  }
  .floor-cell:hover{ outline: 1.5px solid var(--gold); z-index:2; }
  .floor-label{
    font-family: var(--mono); font-size:9px; color: var(--text-faint); display:flex; align-items:center; justify-content:center;
  }
  .tooltip{
    position: fixed; pointer-events:none; z-index: 50;
    background: #0c0a07; border:1px solid var(--gold-dim); border-radius:5px; padding:9px 11px;
    font-family: var(--mono); font-size:11px; color: var(--text); line-height:1.6;
    min-width:170px; max-width: min(220px, calc(100vw - 20px));
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    display:none;
  }
  .tooltip .tt-title{ color: var(--gold); font-weight:700; margin-bottom:3px; }
  .tooltip .tt-row{ display:flex; justify-content:space-between; gap:14px; }

  .machine-legend{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:16px; font-family: var(--mono); font-size:10.5px; color:var(--text-dim);}
  .machine-legend .dot{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; }

  /* period control */
  .period-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background: var(--bg-panel); border:1px solid var(--line); border-radius:6px;
    padding:10px 14px; margin-bottom:16px;
  }
  .period-bar .legend-label{ font-family: var(--mono); font-size:11px; color:var(--text-dim); }
  .period-chip{
    font-family: var(--mono); font-size:11.5px; padding:5px 12px; border-radius:999px;
    border:1px solid var(--line); color:var(--text-dim); background: var(--bg-panel-2); cursor:pointer;
  }
  .period-chip.active{ border-color: var(--gold-dim); color: var(--gold); background:#2c2313; }
  .period-custom{ display:none; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .period-custom.active{ display:flex; }
  .period-custom input[type=date]{
    font-family: var(--mono); font-size:11px; background: var(--bg-panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:4px; padding:4px 6px;
  }
  .period-range-label{ margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }

  /* sparkline + streak */
  .spark-cell{ padding:4px 8px !important; }
  .streak-badge{
    font-family: var(--mono); font-size:10.5px; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line); color: var(--text-dim); white-space:nowrap;
  }
  .streak-badge.hot{ border-color:#ea580c; color:#f0a25c; background:rgba(234,88,12,0.12); }

  footer{ text-align:center; color: var(--text-faint); font-size:10.5px; margin-top:28px; font-family: var(--mono); }
</style>
</head>

<script>
async function __loadJugglerData(){
  const cfgRes = await fetch('data/config.json');
  const config = await cfgRes.json();
  const manRes = await fetch('data/manifest.json');
  const manifest = await manRes.json();
  const dates = manifest.dates;
  const dayResults = await Promise.all(dates.map(d => fetch('data/' + d + '.json').then(r => r.json())));
  const slotData = {};
  for(const slot of Object.keys(config.slotMachine)){ slotData[slot] = []; }
  dayResults.forEach(day => {
    Object.entries(day.slots).forEach(([slot, rec]) => {
      if(!slotData[slot]) slotData[slot] = [];
      slotData[slot].push(Object.assign({date: day.date}, rec));
    });
  });
  Object.values(slotData).forEach(arr => arr.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return {
    slotData: slotData,
    slotMachine: config.slotMachine,
    positions: config.positions,
    machineSlots: config.machineSlots,
    dates: dates,
  };
}

async function __loadPredictions(){
  // 予想・答え合わせデータ(data/predictions/)の読み込み。
  // まだ一つも予想ファイルが無い/manifestが無い状態でも他タブが動くよう、
  // 失敗時は空データを返すだけにして例外を投げない。
  try {
    const manRes = await fetch('data/predictions/manifest.json');
    if(!manRes.ok) return { dates: [], byDate: {} };
    const manifest = await manRes.json();
    const dates = (manifest.dates || []).slice().sort();
    const results = await Promise.all(dates.map(d =>
      fetch('data/predictions/' + d + '.json').then(r => r.ok ? r.json() : null).catch(()=>null)
    ));
    const byDate = {};
    dates.forEach((d,i) => { if(results[i]) byDate[d] = results[i]; });
    return { dates: dates.filter(d => byDate[d]), byDate: byDate };
  } catch(e) {
    return { dates: [], byDate: {} };
  }
}

async function __boot(){
  document.body.insertAdjacentHTML('afterbegin', '<div id="__loadingOverlay" style="position:fixed;inset:0;background:#0b0e14;color:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:9999;">読み込み中...</div>');
  let DATA;
  try {
    DATA = await __loadJugglerData();

function avgSetting(days, periodDates){
  const filtered = periodDates ? days.filter(d=>periodDates.includes(d.date)) : days;
  if(!filtered.length) return null;
  return filtered.reduce((a,d)=>a+d.setting,0)/filtered.length;
}

function avgPayout(days, periodDates){
  const filtered = periodDates ? days.filter(d=>periodDates.includes(d.date)) : days;
  if(!filtered.length) return null;
  return filtered.reduce((a,d)=>a+d.sa,0)/filtered.length;
}

function sumPayout(days, periodDates){
  const filtered = periodDates ? days.filter(d=>periodDates.includes(d.date)) : days;
  if(!filtered.length) return null;
  return filtered.reduce((a,d)=>a+d.sa,0);
}

// 最大(最もプラス)が赤になるよう配色。
const PAYOUT_SCALE = [
  {min:3000,     color:'#dc2626', label:'+3000枚以上'},
  {min:2000,     color:'#f97316', label:'+2000枚以上'},
  {min:1000,     color:'#f59e0b', label:'+1000枚以上'},
  {min:500,      color:'#eab308', label:'+500枚以上'},
  {min:0,        color:'#84cc16', label:'0枚以上'},
  {min:-499,     color:'#14b8a6', label:'-1枚以上'},
  {min:-999,     color:'#06b6d4', label:'-500枚以上'},
  {min:-1999,    color:'#0ea5e9', label:'-1000枚以上'},
  {min:-Infinity,color:'#1d4ed8', label:'-2000枚以上'},
];
function payoutColor(sa){
  for(const band of PAYOUT_SCALE){
    if(sa >= band.min) return band.color;
  }
  return PAYOUT_SCALE[PAYOUT_SCALE.length-1].color;
}

// consecutive days (counting back from the most recent day in the period) with
// setting >= 4 ("好調" / favorable, matching the warm end of the thermal scale)
function goodStreak(days, periodDates){
  const filtered = days.filter(d=>periodDates.includes(d.date)).sort((a,b)=>a.date<b.date?1:-1);
  let streak = 0;
  for(const d of filtered){
    if(d.setting>=4) streak++; else break;
  }
  return streak;
}

// compact inline SVG sparkline of estimated setting over the period (fixed width
// regardless of how many days are in view, so long periods stay scannable)
function buildSparkline(days, periodDates){
  const filtered = periodDates.map(d=>{
    const rec = days.find(x=>x.date===d);
    return rec ? rec.setting : null;
  });
  const w = 90, h = 24, n = filtered.length;
  if(n===0) return '';
  const step = n>1 ? w/(n-1) : 0;
  let points = [];
  filtered.forEach((s,i)=>{
    if(s==null) return;
    const x = n>1 ? i*step : w/2;
    const y = h - ((s-1)/5)*h;
    points.push([x,y,s]);
  });
  let path = points.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  let dots = points.map(p=> `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="${SETTING_HEX[p[2]]}"/>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${path}" fill="none" stroke="var(--gold-dim)" stroke-width="1.2" opacity="0.7"/>
    ${dots}
  </svg>`;
}

// grid bounds — use the original raw row/col positions everywhere (no per-machine
// compression), since columns are shared across machines and shrinking them
// globally shifts other machines' spacing too. We DO trim any fully-empty margin
// columns on the left/right of the whole grid (after the edge-row packing below),
// so the figure isn't padded with blank space that no row actually uses.
let maxRow=0, maxColRaw=0;
Object.values(DATA.positions).forEach(p=>{ maxRow=Math.max(maxRow,p.row); maxColRaw=Math.max(maxColRaw,p.col); });

// Only rows made up ENTIRELY of the three "edge" machines (ハッピージャグラーVIII /
// ジャグラーガールズ / ゴーゴージャグラー3) get their horizontal gaps closed —
// any row that also contains another machine (e.g. マイジャグラーV, ネオアイム) is
// left at its original column positions so those machines' spacing is untouched.
const EDGE_MACHINES = new Set(['ハッピージャグラーVIII','ジャグラーガールズ','ゴーゴージャグラー3']);
const rowsByIndex = {};
Object.entries(DATA.positions).forEach(([slot,p])=>{
  (rowsByIndex[p.row] = rowsByIndex[p.row] || []).push({slot, col:p.col, machine: DATA.slotMachine[slot]});
});
const packedCol = {}; // slot -> overridden column for rendering (pre-margin-trim)
Object.entries(rowsByIndex).forEach(([rowStr, items])=>{
  const allEdge = items.every(it => EDGE_MACHINES.has(it.machine));
  if(!allEdge) return;
  const rowNum = parseInt(rowStr, 10);
  const isBottomRow = rowNum === maxRow; // shift only the bottom-most row
  items.sort((a,b)=>a.col-b.col);
  let newCol = items[0].col;
  let prevMachine = null;
  items.forEach((it,i)=>{
    if(i===0){ newCol = it.col; }
    else { newCol += (it.machine===prevMachine) ? 1 : 2; }
    packedCol[it.slot] = newCol + (isBottomRow ? 4 : 0);
    prevMachine = it.machine;
  });
});

// Trim empty left/right margin: find the true min/max column actually used by
// any cell once edge-row packing is applied, then shift everything so the
// leftmost used column becomes column 0.
let usedMin = Infinity, usedMax = -Infinity;
Object.entries(DATA.positions).forEach(([slot,p])=>{
  const c = (packedCol[slot] !== undefined) ? packedCol[slot] : p.col;
  usedMin = Math.min(usedMin, c);
  usedMax = Math.max(usedMax, c);
});
Object.keys(packedCol).forEach(slot=>{ packedCol[slot] -= usedMin; });
const marginShift = usedMin;
const maxCol = usedMax - usedMin;

const floorGrid = document.getElementById('floorGrid');
floorGrid.style.gridTemplateColumns = `repeat(${maxCol+1}, 34px)`;
floorGrid.style.gridTemplateRows = `repeat(${maxRow+1}, 27px)`;

          if(left < margin) left = margin;
          if(top + th > window.innerHeight - margin){
            top = e.clientY - th - 14; // flip above
          }
          if(top < margin) top = margin;
          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
        });
        div.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });

          const th = tooltip.offsetHeight || 120;
          const margin = 10;
          let left = e.clientX + 14;
          let top = e.clientY + 14;
          if(left + tw > window.innerWidth - margin){
            left = e.clientX - tw - 14;
          }
          if(left < margin) left = margin;
          if(top + th > window.innerHeight - margin){
            top = e.clientY - th - 14;
          }
          if(top < margin) top = margin;
          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
        });
        div.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });
      } else {
        div.style.gridColumn = c+1;
        div.style.gridRow = r+1;
        div.style.background='transparent';
      }
      payoutGrid.appendChild(div);
    }
  }
}
renderPayout();

/* ---------- PREDICT VIEW (予想マップ / 答え合わせ表示) ---------- */
// 3段階カテゴリ表示。既存の設定マップの配色ロジックをそのまま流用し、
// 「有力」= 設定5-6の有力候補(SETTING_HEX[6]と同じ赤)、
// 「やや有力」= やや有力候補(SETTING_HEX[5]と同じ橙)、
// 「対象外」= 予想リストに入らなかった台(データ無しセルと同じ地味なグレー)。
const PREDICT_TIER_COLOR = {'有力': SETTING_HEX[6], 'やや有力': SETTING_HEX[5], '対象外': '#2a251d'};
const PREDICT_TIER_ORDER = ['有力', 'やや有力', '対象外'];

// 答え合わせオーバーレイの判定色(セル枠線で重ねて表示)。
// hit: 予想対象で実際に設定5-6だった / partial: 予想対象で設定4止まり(惜しい)/
// miss: 予想対象だったが設定1-3 / missed: 予想対象外だったのに実際は設定5-6だった(見逃し=今後の学習材料)
function judgePredictCell(tier, actualSetting){
  if(actualSetting == null) return null;
  const picked = tier !== '対象外';
  if(picked){
    if(actualSetting >= 5) return {kind:'hit', color:'#22c55e', label:'的中(設定5-6)'};
    if(actualSetting === 4) return {kind:'partial', color:'#eab308', label:'惜しい(設定4)'};
    return {kind:'miss', color:'#6b6152', label:'外れ(設定1-3)'};
  }
  if(actualSetting >= 5) return {kind:'missed', color:'#a855f7', label:'見逃し(予想対象外だが設定5-6)'};
  return null;
}

(function(){
  const el = document.getElementById('predictLegend');
  if(!el) return;
  el.innerHTML = '';
  PREDICT_TIER_ORDER.forEach(t=>{
    const item = document.createElement('span');
    item.className = 'ls-item';
    const chip = document.createElement('span');
    chip.className = 'legend-chip';
    chip.style.background = PREDICT_TIER_COLOR[t];
    item.appendChild(chip);
    const lab = document.createElement('span');
    lab.className = 'ls-label';
    lab.textContent = t;
    item.appendChild(lab);
    el.appendChild(item);
  });
  [
    {color:'#22c55e', label:'的中(設定5-6)'},
    {color:'#eab308', label:'惜しい(設定4)'},
    {color:'#6b6152', label:'外れ(設定1-3)'},
    {color:'#a855f7', label:'見逃し(対象外→実は5-6)'},
  ].forEach(o=>{
    const item = document.createElement('span');
    item.className = 'ls-item';
    const chip = document.createElement('span');
    chip.className = 'legend-chip';
    chip.style.background = 'transparent';
    chip.style.boxShadow = `inset 0 0 0 2px ${o.color}`;
    item.appendChild(chip);
    const lab = document.createElement('span');
    lab.className = 'ls-label';
    lab.textContent = o.label;
    item.appendChild(lab);
    el.appendChild(item);
  });
})();

let selectedPredictDate = PRED.dates.length ? PRED.dates[PRED.dates.length - 1] : null;
const dateChipsWrapPredict = document.getElementById('dateChipsPredict');
function renderPredictDateChips(){
  dateChipsWrapPredict.innerHTML = '';
  PRED.dates.forEach(d=>{
    const c = document.createElement('span');
    c.className = 'chip' + (d === selectedPredictDate ? ' active' : '');
    const hasActual = DATA.dates.includes(d);
    c.textContent = d.slice(5).replace('-', '/') + (hasActual ? '(答え合わせ)' : '(予想)');
    c.onclick = ()=>{ selectedPredictDate = d; renderPredictDateChips(); renderPredict(); };
    dateChipsWrapPredict.appendChild(c);
  });
}
renderPredictDateChips();

const predictGrid = document.getElementById('predictGrid');
predictGrid.style.gridTemplateColumns = `repeat(${maxCol+1}, 34px)`;
predictGrid.style.gridTemplateRows = `repeat(${maxRow+1}, 27px)`;

function renderPredict(){
  predictGrid.innerHTML = '';
  const predictStatusEl = document.getElementById('predictStatus');
  if(!selectedPredictDate || !PRED.byDate[selectedPredictDate]){
    predictStatusEl.textContent = '予想データがまだありません(data/predictions/ に予想ファイルが作成されていません)。';
    return;
  }
  const pred = PRED.byDate[selectedPredictDate];
  const tiers = pred.table_tiers || {};
  const hasActual = DATA.dates.includes(selectedPredictDate);

  const statusLines = [];
  statusLines.push(`対象日: ${selectedPredictDate}　生成: ${pred.generated_at || '-'}`);
  if(pred.is_event_day){
    statusLines.push(`イベント日: ${pred.event_tier || ''}（${pred.event_day_reason || ''}）`);
  }
  if(hasActual && pred.evaluation){
    const ov = pred.evaluation.overall || {};
    statusLines.push(`答え合わせ: 的中${ov.hit_count ?? '-'} / 惜しい${ov.partial_count ?? '-'} / 外れ${ov.miss_count ?? '-'}（的中率 ${ov.hit_rate != null ? Math.round(ov.hit_rate*100)+'%' : '-'}）`);
  } else if(hasActual){
    statusLines.push('実データは収集済みですが、まだ答え合わせ(evaluation)が記録されていません。');
  } else {
    statusLines.push('翌日以降の予想です(まだ実データがありません)。');
  }
  predictStatusEl.textContent = statusLines.join('\n');

  const cellMap = {};
  Object.entries(DATA.positions).forEach(([slot,pos])=>{
    const col = (packedCol[slot] !== undefined) ? packedCol[slot] : (pos.col - marginShift);
    cellMap[`${pos.row}_${col}`] = slot;
  });
  for(let r=0;r<=maxRow;r++){
    for(let c=0;c<=maxCol;c++){
      const slot = cellMap[`${r}_${c}`];
      const div = document.createElement('div');
      if(slot){
        const tier = tiers[slot] || '対象外';
        div.className = 'floor-cell';
        div.style.background = PREDICT_TIER_COLOR[tier] || PREDICT_TIER_COLOR['対象外'];
        div.style.gridColumn = c+1;
        div.style.gridRow = r+1;
        div.textContent = slot;

        let actualRec = null, judgement = null;
        if(hasActual){
          const days = DATA.slotData[slot] || [];
          actualRec = days.find(d=>d.date===selectedPredictDate) || null;
          judgement = judgePredictCell(tier, actualRec ? actualRec.setting : null);
          if(judgement){
            div.style.boxShadow = `inset 0 0 0 2px ${judgement.color}`;
          }
        }

        div.addEventListener('mousemove', (e)=>{
          const machine = DATA.slotMachine[slot];
          let html = `<div class="tt-title">${machine} #${slot}</div>`;
          html += `<div class="tt-row"><span>予想</span><span>${tier}</span></div>`;
          if(hasActual){
            if(actualRec){
              html += `<div class="tt-row"><span>実際の推定設定</span><span>${actualRec.setting} (${actualRec.conf})</span></div>`;
            } else {
              html += `<div class="tt-row"><span>実データ</span><span>-</span></div>`;
            }
            if(judgement){
              html += `<div class="tt-row"><span>判定</span><span style="color:${judgement.color}">${judgement.label}</span></div>`;
            }
          }
          const matched = (pred.predictions || []).find(p=>
            (p.type === 'table' && p.target === slot) ||
            (p.type === 'machine' && p.target === machine)
          );
          if(matched){
            html += `<div style="margin-top:6px; color:var(--text-dim); font-size:10px; line-height:1.4; max-width:200px;">${matched.reason}</div>`;
          }
          tooltip.innerHTML = html;
          tooltip.style.display='block';
          const tw = tooltip.offsetWidth || 190;
          const th = tooltip.offsetHeight || 120;
          const margin = 10;
          let left = e.clientX + 14;
          let top = e.clientY + 14;
          if(left + tw > window.innerWidth - margin){ left = e.clientX - tw - 14; }
          if(left < margin) left = margin;
          if(top + th > window.innerHeight - margin){ top = e.clientY - th - 14; }
          if(top < margin) top = margin;
          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
        });
        div.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });
      } else {
        div.style.gridColumn = c+1;
        div.style.gridRow = r+1;
        div.style.background='transparent';
      }
      predictGrid.appendChild(div);
    }
  }
}
renderPredict();
